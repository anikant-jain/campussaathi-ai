services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: campus
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - campus_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
      DATABASE_URL: postgresql://campus:${POSTGRES_PASSWORD}@db:5432/campus
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in your environment}
      HOST: 0.0.0.0
      PORT: 5000
    ports:
      - "5000:5000"
    command: ["sh","-c","npm run db:migrate && npm start"]
volumes:
  campus_pg:

